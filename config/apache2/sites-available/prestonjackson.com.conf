<VirtualHost *:80>
    ServerAdmin admin@prestonjackson.com

    ServerName prestonjackson.com
    ServerAlias www.prestonjackson.com
    ServerAlias api.prestonjackson.com
    ServerAlias localhost

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    DocumentRoot /var/www/prestonjackson.com/site/doc
    <Directory "/var/www/prestonjackson.com/site/doc">
        Options +Includes
        XBitHack full
    </Directory>

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =api.prestonjackson.com [OR]
    RewriteCond %{SERVER_NAME} =www.prestonjackson.com [OR]
    RewriteCond %{SERVER_NAME} =prestonjackson.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]


    ScriptAlias /api /var/www/prestonjackson.com/site/api/gateway.py
    <Directory "/var/www/prestonjackson.com/site/api/">
        AllowOverride None
        Options +ExecCGI
        AddHandler cgi-script .cgi
        Require all granted
    </Directory>
    # [PT] = Passthrough (reprocess generated URL)
    # [QSA] = Query String Append (from request to rewritten request)
    RewriteEngine On
    RewriteRule ^/api/(.*)$ /api/gateway.py?$1 [PT,QSA]

    AddDefaultCharset UTF-8

</VirtualHost>
