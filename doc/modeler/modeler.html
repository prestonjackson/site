<!DOCTYPE html>
<html lang="en">
<head>
  <title>Preston Jackson</title>
<!--#include virtual="/template/head.html" -->
  <script src="/modeler/script/signaler.js"></script>
  <script src="/modeler/script/connection.js"></script>
  <script src="/modeler/script/canvas.js"></script>
  <script src="/modeler/script/tool.js"></script>
  <script src="/modeler/script/truck.js"></script>
  <script src="/modeler/script/dolly.js"></script>
  <script src="/modeler/script/orbit.js"></script>
  <script src="/modeler/script/app.js"></script>
</head>
<body onload="main(document.baseURI)">
  <div id="content">
    <div id="surface">
      <canvas id="canvas"></canvas>
    </div>
    <div id="toolbar">
      <button id="truck-button" type="button">Truck</button>
      <button id="dolly-button" type="button">Dolly</button>
      <button id="orbit-button" type="button">Orbit</button>
    </div>
    <div id="controls">
      <button id="offer-button" type="button">Offer</button>
      <button id="answer-button" type="button">Answer</button>
      <button id="connect-button" type="button">Connect</button>
      <button id="disconnect-button" type="button">Disconnect</button>
      <button id="send-button" type="button">Send</button>
      <input id="message-input-box" type="text" size="60" placeholder="Message">
      </input>
      <div id="receive-box">
        <p>Received messages:</p>
      </div>
    </div>
  </div>
</body>
</html>
