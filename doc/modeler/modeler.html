<!DOCTYPE html>
<html lang="en">
<head>
  <title>Preston Jackson</title>
<!--#include virtual="/template/head.html" -->
  <script type="module" src="/modeler/script/app.js"></script>
</head>
<body>
  <div id="content">
    <div id="surface">
      <canvas id="canvas"></canvas>
    </div>
    <div id="toolbar">
      <button id="select-button" type="button"><img src="/modeler/image/select.svg" alt="Select"></button>
      <button id="orbit-button" type="button"><img src="/modeler/image/orbit.svg" alt="Orbit"></button>
      <button id="dolly-button" type="button"><img src="/modeler/image/dolly.svg" alt="Dolly"></button>
      <button id="truck-button" type="button"><img src="/modeler/image/truck.svg" alt="Truck"></button>
      <button id="pencil-button" type="button"><img src="/modeler/image/pencil.svg" alt="Pencil"></button>
      <button id="rectangle-button" type="button"><img src="/modeler/image/rectangle.svg" alt="Rectangle"></button>
    </div>
    <div id="controls">
      <button id="offer-button" type="button">Offer</button>
      <button id="answer-button" type="button">Answer</button>
      <button id="connect-button" type="button">Connect</button>
      <button id="disconnect-button" type="button">Disconnect</button>
      <button id="send-button" type="button">Send</button>
      <input id="message-input-box" type="text" size="60" placeholder="Message">
      </input>
      <div id="receive-box">
        <p>Received messages:</p>
      </div>
    </div>
  </div>
</body>
</html>
