<!DOCTYPE html>
<html>
<head>
<title>Preston Jackson</title>
  <link rel="stylesheet" type="text/css" href="site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <script src="app.js"></script>
</head>
<body onload="main()">
  <div id="content">
    <header>
      <p>Preston Jackson’s Commonplace Book</p>
    </header>
    <div id="main">
      <p>Welcome to <a href="https://prestonjackson.com">prestonjackson.com</a></p>
    </div>
    <div id="surface">
      <canvas id="canvas" width="400" height="400"></canvas><br/>
    </div>
    <div>
      <button id="connect-button" type="button">Connect</button>
      <button id="disconnect-button" type="button">Disconnect</button>
      <button id="send-button" type="button">Send</button>
      <input id="message-input-box" type="text" size="60" placeholder="Message">
      </input>
      <div id="receive-box">
        <p>Received messages:</p>
      </div>
      </div>
    </div>
    <footer>
      <p>© 2024 Preston Jackson • All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
