<!DOCTYPE html>
<html lang="en">
<head>
  <title>Preston Jackson</title>
<!--#include virtual="/template/head.html" -->
  <script src="/script/app.js"></script>
</head>
<body onload="main(document.baseURI)">
  <div id="content">
<!--#include virtual="/template/header.html" -->
    <div id="main">
      <!--<p>Welcome to <a href="https://prestonjackson.com">prestonjackson.com</a></p> -->
      <p>Testing <a href="https://prestonjackson.com">testapp.com</a></p>
    </div>
    <div id="surface">
      <canvas id="canvas" width="400" height="400"></canvas><br/>
    </div>
    <div>
      <button id="offer-button" type="button">Offer</button>
      <button id="answer-button" type="button">Answer</button>

      </div>
